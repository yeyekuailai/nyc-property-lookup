<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NYC Property Lookup</title>
  <meta name="description" content="输入纽约市地址，查看地块、Building Information 和 Notice of Property Value。">
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183047;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#102e4e,#196d9b);color:white;padding:38px max(22px,calc((100vw - 1060px)/2))}header h1{font-size:30px;margin:0 0 9px}main{max-width:1060px;margin:28px auto;padding:0 22px}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:24px;margin:0 0 18px;box-shadow:0 4px 16px #17334f0a}label{display:block;font-weight:700;margin-bottom:10px}.entry{display:flex;gap:10px}input{flex:1;min-width:0;padding:14px;border:1px solid #a9bfd2;border-radius:9px;font:inherit}button,.primary{border:0;border-radius:9px;background:#136ea6;color:white;font:inherit;font-weight:700;padding:13px 21px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.primary:hover{background:#0c5583}button:disabled{opacity:.6;cursor:wait}.muted{color:#65788a}.small{font-size:13px}.message{padding:13px;border-radius:9px;background:#e8f3fb}.error{background:#fff0ec;color:#a22d22}.warning{background:#fff6dc;color:#785300}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}h2{margin:0 0 16px;font-size:21px}table{width:100%;border-collapse:collapse}td{border-bottom:1px solid #e9eef4;padding:10px 4px;vertical-align:top}td:first-child{width:45%;color:#687b8d}a{color:#12649b}.pill{display:inline-block;background:#e8f3fb;color:#0d608d;border-radius:30px;padding:5px 11px;font-size:13px}.links{display:flex;gap:14px;flex-wrap:wrap}.notice{border:1px solid #cbe4f2;background:#f3faff;border-radius:10px;padding:18px}.notice .primary{margin:10px 0}.co-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.record{border:1px solid #dce5ee;border-radius:10px;padding:16px}.record p{margin:5px 0 12px}.record .primary{padding:9px 13px;font-size:14px}.secondary-links{margin-top:16px}.hpd-links a{background:#edf6fb;border-radius:8px;padding:10px 13px;text-decoration:none;font-weight:700}#result{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.entry{flex-direction:column}}
  </style>
</head>
<body>
  <header><h1>NYC Property Lookup</h1></header>
  <main>
    <section class="card"><form id="searchForm"><label for="address">第一步：用地址定位地块</label><div class="entry"><input id="address" required placeholder="例如 20-28 154th St, Flushing, NY 11357" autocomplete="street-address"><button id="searchButton">查询物业</button></div></form><p class="muted small">找到地块后，第二步显示 County，并统一使用 Borough、Block、Lot 查询 NOPV、入住许可证和 HPD 记录。</p></section>
    <section class="card"><form id="bblForm"><label for="bblInput">已有 BBL？直接查询</label><div class="entry"><input id="bblInput" required placeholder="例如 3-6264-77 或 3062640077" inputmode="numeric"><button id="bblButton">用 BBL 查询</button></div></form></section>
    <div id="status" role="status"></div><div id="result"></div>
  </main>
  <script src="./app.js?v=20260923-1" defer></script>
</body>
</html>
